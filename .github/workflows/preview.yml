name: Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview-config:
    name: preview configuration
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Check Vercel environment contract
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Vercel preview credentials are not configured; the repository Vercel integration remains the preview evidence." >> "$GITHUB_STEP_SUMMARY"
          fi

  preview:
    needs: preview-config
    if: github.event.pull_request.head.repo.full_name == github.repository && needs.preview-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: preview
    env:
      APP_ENV: preview
      SUPABASE_SCHEMA: public
      NEXT_PUBLIC_SUPABASE_SCHEMA: public
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: ${{ github.head_ref }}
      VERCEL_PULL_ENV: preview
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.0.0 --no-audit --fund=false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Build and deploy prebuilt preview
        id: deploy
        run: npm run deploy:preview
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Browser smoke and regression checks
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          CI: 'true'
        run: npm run test:regression:ci
      - name: Upload preview reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-artifacts-${{ github.run_id }}
          path: |
            _artifacts/ci/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
