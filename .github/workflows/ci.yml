name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ github.event_name == 'pull_request' && 'affected checks' || 'full checks' }}
    runs-on: ubuntu-latest
    env:
      APP_ENV: preview
      SUPABASE_SCHEMA: public
      NEXT_PUBLIC_SUPABASE_SCHEMA: public
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-only-key
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@10.0.0 --no-audit --fund=false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run affected checks
        if: github.event_name == 'pull_request'
        run: npm run ci:changed
      - name: Run full checks
        if: github.event_name == 'push'
        run: npm run ci:full
      - name: Upload compact CI artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-artifacts-${{ github.run_id }}
          path: _artifacts/ci/
          if-no-files-found: ignore
          retention-days: 7
