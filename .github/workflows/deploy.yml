name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        default: staging
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      APP_ENV: staging
      SUPABASE_SCHEMA: public
      NEXT_PUBLIC_SUPABASE_SCHEMA: public
      SUPABASE_ALLOW_REMOTE_DRY_RUN: '1'
      SUPABASE_ALLOW_REMOTE_APPLY: '1'
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: staging
      VERCEL_PULL_ENV: preview
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.0.0 --no-audit --fund=false
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run db:dry-run
      - run: npm run db:apply
      - id: deploy
        run: npm run deploy:preview
      - run: npx --no-install playwright install --with-deps chromium
      - name: Staging browser smoke
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          CI: 'true'
        run: npm run test:regression:ci
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-artifacts-${{ github.run_id }}
          path: |
            _artifacts/ci/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_ENV: production
      SUPABASE_SCHEMA: public
      NEXT_PUBLIC_SUPABASE_SCHEMA: public
      SUPABASE_ALLOW_REMOTE_DRY_RUN: '1'
      SUPABASE_ALLOW_REMOTE_APPLY: '1'
      SUPABASE_PRODUCTION_APPROVED: ${{ vars.SUPABASE_PRODUCTION_APPROVED }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_GIT_BRANCH: main
      VERCEL_PULL_ENV: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@10.0.0 --no-audit --fund=false
      - run: npm ci --ignore-scripts --no-audit --fund=false
      - run: npm run db:dry-run
      - run: npm run db:apply
      - id: deploy
        run: npm run deploy:preview
      - run: npx --no-install playwright install --with-deps chromium
      - name: Smoke-test exact artifact
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment_url }}
          CI: 'true'
        run: npm run test:regression:ci
      - name: Promote smoke-tested artifact
        env:
          VERCEL_DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: npm run deploy:promote
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-artifacts-${{ github.run_id }}
          path: |
            _artifacts/ci/
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
